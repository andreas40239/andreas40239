<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spielekiste von CreateForKids.ch: selbst gebaute Android-Spiele für Kinder und Familien.">
<title>Spielekiste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;500;700&family=Comfortaa:wght@700&family=Noto+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: eine Spalte wie ein Regal voller App-Icons (Handy), ab Tablet 2, ab Desktop 3 Spalten; jedes Spiel hat seine eigene Farbe. */
:root {
  --bg: #f2efff;
  --bg-dots: #ddd6ff;
  --card: #ffffff;
  --ink: #1d1745;
  --muted: #5d5785;
  --line: #e2dcff;
  --accent: #ff5b3a;
  --sun: #ffc83d;
  --chip: #ece8ff;
  --shadow: 0 3px 0 #d6cefc;
  /* Griechisch fällt automatisch auf Comfortaa / Noto Sans, Chinesisch auf die System-Schrift */
  --font-display: "Lilita One", "Comfortaa", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Arial Rounded MT Bold", sans-serif;
  --font-body: "Lexend", "Noto Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141029; --bg-dots: #241d47; --card: #1f1940; --ink: #f4f1ff; --muted: #aea6d6;
    --line: #2f2760; --accent: #ff7a5c; --sun: #ffd25e; --chip: #2a2254; --shadow: 0 3px 0 #0b0820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141029; --bg-dots: #241d47; --card: #1f1940; --ink: #f4f1ff; --muted: #aea6d6;
  --line: #2f2760; --accent: #ff7a5c; --sun: #ffd25e; --chip: #2a2254; --shadow: 0 3px 0 #0b0820;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 56px; }

/* ---------- Leiste oben: Marke + Flaggen ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); text-decoration: none; letter-spacing: .01em; }
.brand span { color: var(--accent); }
.langs { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lang {
  width: 38px; height: 38px; padding: 0; border-radius: 50%; overflow: hidden; cursor: pointer;
  border: 3px solid var(--card); background: var(--card);
  box-shadow: 0 0 0 2px var(--line); transition: transform .2s cubic-bezier(.3, 1.8, .5, 1), box-shadow .2s;
}
.lang svg { display: block; width: 100%; height: 100%; }
.lang:hover { transform: translateY(-2px) rotate(-6deg); }
.lang[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.1); }
.lang:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------- Kopf ---------- */
header { position: relative; padding-block: 26px 8px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 999px; transform: rotate(-2deg);
}
.eyebrow b { color: var(--sun); }
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(3rem, 15vw, 6.5rem); line-height: .95; letter-spacing: .01em;
  margin: 18px 0 12px; text-wrap: balance;
}
:lang(el) h1 { font-weight: 700; font-size: clamp(2.3rem, 11vw, 5rem); letter-spacing: -.01em; }
h1 .w { display: inline-block; white-space: nowrap; }
h1 .l { display: inline-block; animation: hop 2.8s ease-in-out infinite; }
h1 .l.c0 { color: var(--accent); }
h1 .l.c2 { color: #7b5cff; }
h1 .l.c3 { color: #12b886; }
h1 .l.c4 { color: #f59f00; }
@keyframes hop { 0%, 80%, 100% { transform: translateY(0) } 88% { transform: translateY(-10px) rotate(-4deg) } }
.lede { font-size: 1.05rem; color: var(--muted); max-width: 36ch; margin: 0; text-wrap: pretty; }
.lede strong { color: var(--ink); }

.blob { position: absolute; pointer-events: none; z-index: -1; }
.blob.s1 { right: 4%; top: 10px; width: 64px; height: 64px; background: var(--sun); border-radius: 46% 54% 40% 60%; animation: float 6s ease-in-out infinite; }
.blob.s2 { right: 22%; top: 94px; width: 26px; height: 26px; background: #7b5cff; border-radius: 50%; animation: float 5s ease-in-out infinite reverse; }
.blob.s3 { right: 2%; top: 140px; width: 40px; height: 40px; background: var(--accent); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 14s linear infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(8deg) } }
@keyframes spin { to { transform: rotate(360deg) } }

/* ---------- Filter ---------- */
.filters {
  display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 10px;
  margin-top: 26px; scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: none; font: 500 .9rem var(--font-body); color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s, background .15s;
}
.filter:active { transform: translateY(2px); box-shadow: none; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter .n { font-variant-numeric: tabular-nums; opacity: .6; margin-left: 4px; }
.filter:focus-visible, .store:focus-visible, footer a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Karten ---------- */
.grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 14px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1050px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.card {
  --hue: #7b5cff;
  position: relative; display: flex; flex-direction: column; gap: 14px;
  background: var(--card); border: 2px solid var(--line); border-radius: 26px;
  padding: 18px; min-width: 0;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--hue) 35%, var(--line));
  animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
@keyframes pop { from { transform: scale(.94) translateY(8px) } to { transform: none } }

.top { display: flex; gap: 14px; align-items: center; }
.icon {
  flex: none; width: 76px; height: 76px; border-radius: 24px;
  display: grid; place-items: center; font-size: 42px; line-height: 1;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.55) 0 18%, transparent 19%),
    linear-gradient(150deg, var(--hue), var(--hue2, var(--hue)));
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 4px 10px color-mix(in srgb, var(--hue) 40%, transparent);
  transform: rotate(var(--tilt, -4deg));
  transition: transform .25s cubic-bezier(.3, 1.8, .5, 1);
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.card:hover .icon { transform: rotate(0) scale(1.06); }
.icon.boing { animation: boing .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes boing { 30% { transform: scale(.82) rotate(8deg) } 70% { transform: scale(1.12) rotate(-6deg) } }
.icon span { filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); }

.head { min-width: 0; }
.genre { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--hue) 75%, var(--ink)); }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; overflow-wrap: anywhere; }

.desc { margin: 0; color: var(--muted); font-size: .95rem; text-wrap: pretty; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chips li { font-size: .78rem; font-weight: 500; background: var(--chip); border-radius: 8px; padding: 3px 9px; }

.store {
  margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px;
  text-decoration: none; color: var(--ink); font-weight: 700; font-size: .95rem; text-align: center;
  border: 2px dashed color-mix(in srgb, var(--hue) 60%, var(--line));
  background: color-mix(in srgb, var(--hue) 9%, var(--card));
  border-radius: 16px; padding: 11px 14px; cursor: pointer;
  transition: transform .15s;
}
.store:active { transform: scale(.97); }
.store svg { width: 20px; height: 20px; flex: none; }
.store small { font-weight: 500; color: var(--muted); }
.store.live { border-style: solid; background: var(--ink); color: var(--bg); }

/* ---------- Fuß ---------- */
footer {
  margin-top: 44px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 18px; color: var(--muted); font-size: .85rem; text-align: center;
}
footer a { color: var(--ink); font-weight: 700; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 160%); transition: transform .3s cubic-bezier(.3, 1.5, .5, 1);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px;
  font-weight: 500; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; z-index: 10;
}
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

/* ---------- Flaggen (SVG, damit sie auch unter Windows erscheinen) ---------- */
function star(cx, cy, r, rot) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.382 : r;
    pts.push((cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return `<polygon fill="#FFDE00" points="${pts.join(" ")}"/>`;
}

const LANGS = Object.keys(UI);

/* ---------- Hilfen ---------- */
const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00d47e" d="M4 2.6 13.6 12 4 21.4c-.3-.2-.5-.6-.5-1V3.6c0-.4.2-.8.5-1Z"/><path fill="#ffc83d" d="m17 8.6-3.4 3.4 3.4 3.4 3.7-2.1c.8-.5.8-1.6 0-2.1L17 8.6Z"/><path fill="#ff4d5a" d="M13.6 12 4 21.4c.3.2.8.2 1.2 0L17 15.4 13.6 12Z"/><path fill="#2bb5ff" d="M13.6 12 17 8.6 5.2 2.6c-.4-.2-.9-.2-1.2 0l9.6 9.4Z"/></svg>';
const isRealLink = (url) => /^https:\/\/play\.google\.com\//.test(url || "");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);

function pickStartLang() {
  try { const saved = localStorage.getItem("spielekiste-lang"); if (UI[saved]) return saved; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || ""]) {
    const code = l.toLowerCase().split("-")[0];
    if (UI[code]) return code;
  }
  return "de";
}

let lang = pickStartLang();
let filter = "alle";

/* ---------- Zeichnen ---------- */
function renderTitle(t) {
  let k = 0;
  // "Spiele kiste" → zwei Zeilen ohne Leerzeichen, alle anderen Sprachen wortweise
  const words = t.title.split(" ");
  return words.map((w) =>
    `<span class="w">${[...w].map((ch) => `<span class="l c${(k++) % 5}">${esc(ch)}</span>`).join("")}</span>`
  ).join(t.titleJoin === "" ? "<br>" : " ");
}

function render() {
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;

  $("langs").setAttribute("aria-label", t.langLabel);
  $("langs").innerHTML = LANGS.map((l) =>
    `<li><button type="button" class="lang" id="lang-${l}" data-lang="${l}" lang="${l}" aria-pressed="${l === lang}" aria-label="${esc(UI[l].name)}" title="${esc(UI[l].name)}">${FLAGS[l]}</button></li>`
  ).join("");

  $("eyebrow").innerHTML = t.eyebrow.replace("{n}", GAMES.length);
  $("title").innerHTML = renderTitle(t);
  $("title").setAttribute("aria-label", t.title.replace(" ", t.titleJoin ?? " "));
  $("lede1").textContent = t.lede1;
  $("lede2").textContent = t.lede2;
  $("tip").textContent = t.tip;
  $("privacy").textContent = t.privacy;

  $("filters").setAttribute("aria-label", t.filterLabel);
  $("filters").innerHTML = FILTER_IDS.map((f, i) => {
    const n = f === "alle" ? GAMES.length : GAMES.filter((g) => g.tags.includes(f)).length;
    return `<button type="button" class="filter" id="filter-${f}" data-f="${f}" aria-pressed="${f === filter}">${esc(t.filters[i])}<span class="n">${n}</span></button>`;
  }).join("");

  const shown = GAMES.filter((g) => filter === "alle" || g.tags.includes(filter));
  $("grid").innerHTML = shown.map((g, i) => {
    const [genre, desc, chips] = g.text[lang] || g.text.de;
    const store = isRealLink(g.playStore)
      ? `<a class="store live" href="${esc(g.playStore)}" target="_blank" rel="noopener">${PLAY_ICON}<span>${esc(t.get)}</span></a>`
      : `<a class="store" href="#${esc(g.id)}" data-placeholder="${esc(g.playStore)}">${PLAY_ICON}<span>Play Store <small>· ${esc(t.soon)}</small></span></a>`;
    return `
    <article class="card" id="${esc(g.id)}" style="--hue:${g.hue};--hue2:${g.hue2};--tilt:${g.tilt};--i:${i}">
      <div class="top">
        <div class="icon" role="img" aria-label="${esc(t.icon)} ${esc(g.title)}"><span>${g.icon}</span></div>
        <div class="head">
          <div class="genre">${esc(genre)}</div>
          <h2>${esc(g.title)}</h2>
        </div>
      </div>
      <p class="desc">${esc(desc)}</p>
      <ul class="chips">${chips.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
      ${store}
    </article>`;
  }).join("");
}

/* ---------- Bedienung ---------- */
$("langs").addEventListener("click", (e) => {
  const b = e.target.closest(".lang");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("spielekiste-lang", lang); } catch (err) {}
  render();
  $("lang-" + lang).focus();
});

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".filter");
  if (!b) return;
  filter = b.dataset.f;
  render();
  $("filter-" + filter).focus();
});

const toast = $("toast");
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}

$("grid").addEventListener("click", (e) => {
  const icon = e.target.closest(".icon");
  if (icon) {
    icon.classList.remove("boing"); void icon.offsetWidth; icon.classList.add("boing");
    return;
  }
  const store = e.target.closest(".store:not(.live)");
  if (store) {
    e.preventDefault();
    const title = store.closest(".card").querySelector("h2").textContent;
    showToast(UI[lang].toast.replace("{t}", title));
  }
});

render();
</script>
</body>
</html>
