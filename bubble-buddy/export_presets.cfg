; Android export preset for Bubble Buddy.
;
; Signing credentials are deliberately NOT stored here. Supply them at build
; time through the environment variables Godot reads for CI:
;   GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD
; See README.md ("Building the APK").

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="shots/*"
export_path="build/BubbleBuddy.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory="res://android"
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=1
version/name="1.0"
package/unique_name="com.bubblebuddy.game"
package/name="Bubble Buddy"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://icons/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://icons/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://icons/adaptive_background_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
permissions/access_network_state=false
permissions/internet=false
permissions/access_wifi_state=false
permissions/read_external_storage=false
permissions/write_external_storage=false
permissions/record_audio=false
permissions/camera=false
permissions/access_fine_location=false
permissions/access_coarse_location=false
