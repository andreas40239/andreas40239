name: Coaster Demo – Android APK

on:
  push:
    paths:
      - "coaster_demo/**"
      - ".github/workflows/coaster-android.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaster_demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot + Android-Templates laden
        run: |
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$T"
          rm /tmp/templates.tpz

      - name: Debug-Keystore + Editor-Einstellungen
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          done

      - name: Import + Smoke-Test
        run: |
          timeout 120 godot --headless --path . --import || true
          timeout 120 godot --headless --path . -s res://tests/smoke_test.gd

      - name: APK exportieren (arm64-v8a, debug-signiert)
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android arm64" build/coaster_demo_arm64.apk
          test -f build/coaster_demo_arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coaster_demo_arm64
          path: coaster_demo/build/coaster_demo_arm64.apk
