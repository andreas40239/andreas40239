name: Schattengruft APK

on:
  push:
    paths:
      - 'schattengruft/**'
      - '.github/workflows/schattengruft-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schattengruft/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schattengruft-apk
          path: schattengruft/android/app/build/outputs/apk/release/app-release.apk
