name: Drachen-Labyrinth Android-APK

on:
  push:
    paths:
      - "labyrinth-game/**"
      - ".github/workflows/labyrinth-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Export-Vorlagen einrichten
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug-Signaturschluessel erzeugen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: APK bauen (arm64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd labyrinth-game
          mkdir -p build
          godot --headless --editor --quit || true
          godot --headless --export-debug "Android" build/drachen-labyrinth.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: drachen-labyrinth-apk
          path: labyrinth-game/build/drachen-labyrinth.apk
